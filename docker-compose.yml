version: '3.8'

services:
  # --- DATABASE SERVICE ---
  db:
    image: ankane/pgvector:latest
    container_name: ey_compliance_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- BACKEND SERVICE (Updated for Ollama) ---
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: ey_compliance_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    # THIS IS THE CRITICAL ADDITION:
    # It allows the container to talk to Ollama on your host machine
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # --- FRONTEND SERVICE ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ey_compliance_frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
